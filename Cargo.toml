[package]
name = "nanfeng-codex-quota"
version = "0.1.2"
edition = "2024"
license = "Apache-2.0"
description = "南枫 Codex 额度：Windows 只读额度悬浮窗"
repository = "https://github.com/nanzhufeng/NanfengCodexQuota-Windows"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
fontdue = "0.9"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Controls"] }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
